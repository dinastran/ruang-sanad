<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Offline — Tasbih</title>
<style>
  :root { --bg:#ffffff; --fg:#0f172a; --muted:#64748b; --brand:#0891b2; --card:#f1f5f9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#070b16; --fg:#f8fafc; --muted:#94a3b8; --brand:#22d3ee; --card:#172033; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; }
  main { max-width: 22rem; text-align:center; }
  img { width:88px; height:88px; border-radius:22px; }
  h1 { font-size: 1.25rem; margin: 1.25rem 0 .5rem; }
  p { color: var(--muted); line-height: 1.55; margin: 0 0 1.5rem; font-size: .95rem; }
  a { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:0 1.5rem; border-radius:14px;
      background:var(--brand); color:#fff; text-decoration:none; font-weight:600; }
  @media (prefers-color-scheme: dark) { a { color:#070b16; } }
</style>
</head>
<body>
<main>
  <img src="/public/icons/tasbih-192.png" alt="">
  <h1>Anda sedang offline</h1>
  <p>Halaman ini belum tersimpan di perangkat. Tasbih tetap bisa dipakai — hitungan akan tersinkron otomatis saat internet kembali.</p>
  <a href="/app/tasbih">Buka Tasbih</a>
</main>
</body>
</html>
