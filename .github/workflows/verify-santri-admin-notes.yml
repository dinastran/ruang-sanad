name: Verify santri admin notes branch

on:
  push:
    branches:
      - feature/santri-admin-notes

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve Go dependencies in runner
        run: go mod tidy

      - name: Targeted santri note tests
        run: go test ./app/services -run 'TestSantriAdminNoteHistoryCreateEditAndScope|TestSantriDeleteRemovesRelatedDataAndVoiceNoteButKeepsKelas'

      - name: Verify build and vet
        run: npm run verify

      - name: Go regression tests
        run: go test ./...
