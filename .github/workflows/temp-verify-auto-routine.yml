name: Temporary verify auto routine schedules

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: go mod tidy
      - run: git diff --exit-code go.mod
      - run: go test ./app/services/...
      - run: npm run build
      - run: go test ./...
