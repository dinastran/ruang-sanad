name: Verify User Guru Product CRM UX

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Prepare Go modules
        run: go mod tidy

      - name: Go formatting check
        run: |
          files="app/handlers/admin.go app/models/guru.go app/models/product_crm.go app/queries/querier.go app/queries/product_crm.go app/services/guru.go app/services/guru_directory_test.go app/services/product_crm.go app/services/product_crm_test.go app/services/user.go app/services/user_admin_test.go routes/web.go"
          test -z "$(gofmt -l $files)"

      - name: Targeted behavior tests
        run: go test ./app/services -run 'TestDeleteManagedUserAuthorizationAndSelfProtection|TestGuruDirectoryDetailIncludesLinkedUserIdentity|TestProductPurchaseReducesAndCancellationRestoresStock'

      - name: Verify build and vet
        run: npm run verify

      - name: Go regression tests
        run: go test ./...
